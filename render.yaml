services:
  - type: web
    name: signal-library
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: APP_MODE
        value: demo
