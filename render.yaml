services:
  - type: web
    name: signal-library
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: node --expose-gc ./node_modules/next/dist/bin/next start -H 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: APP_MODE
        value: demo
